name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Offline example
        run: python examples/minimal_host.py
      - name: Build and validate release artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python scripts/check_release.py --distribution lithe --package lithe --clean-only
          python -m pip install build twine
          python scripts/check_release.py --distribution lithe --package lithe
