name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py --distribution lithe --package lithe --clean-only
      - run: python -m pip install --upgrade build twine
      - run: python scripts/check_release.py --distribution lithe --package lithe
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
